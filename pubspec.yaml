name: vaishnavi
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5
  camera: ^0.12.0+1
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  http: ^1.6.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  flutter_compass: ^0.8.1
  google_generative_ai: ^0.4.6

  # Added for Milestone 1 (Improved Object Detection).
  # tflite_flutter: runs the bundled COCO SSD MobileNet model.
  # image: converts raw camera frames (YUV420/BGRA8888) to RGB for the model.
  tflite_flutter: ^0.11.0
  image: ^4.3.0

  # Added for Milestone 2 (User Behaviour Learning).
  # hive / hive_flutter: local on-device persistence for the user's
  # behaviour profile. No code-generation step is required — the
  # profile is stored as a plain Map (see UserBehaviourProfile.toMap),
  # which Hive supports natively.
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Added for Milestone 5 (Emergency Assistance System).
  # url_launcher: launches the device's SMS app with a pre-filled
  # emergency message — no hardware, no new permissions beyond what
  # the OS's own SMS app already handles.
  url_launcher: ^6.3.1

  # Added to implement a REAL (not architecture-only) hardware trigger
  # for IEmergencySignalSource: sensors_plus exposes the device
  # accelerometer, used by FallDetectionSignalSource for threshold-
  # based fall detection (see that file's doc comment for the exact
  # algorithm and its known limitations).
  sensors_plus: ^6.1.1

  # Added for Milestone 7 (Evaluation Framework).
  # path_provider: locates a writable app documents directory to
  # export the evaluation CSV to.
  path_provider: ^2.1.4

  # Added for the pre-vision-swap Model Benchmark Harness (see
  # lib/services/benchmark/). Every benchmark result is tagged with
  # the exact device model + chipset + Android version it ran on, so
  # results collected from many different physical devices/testers
  # can be told apart and aggregated later — this app must work
  # broadly across many devices, not just whichever one a benchmark
  # happened to be run on.
  device_info_plus: ^11.2.0

  # Added for Stage 2 (GTFS Mobility Engine — lib/services/gtfs/,
  # lib/database/gtfs_database.dart). stop_times alone is ~1.36M rows
  # for the bundled Chennai feed — sqflite (SQLite) is the relational,
  # on-disk store this is built around, deliberately NOT the Hive
  # key-value store used elsewhere in this project (evaluation
  # records, benchmark results): GTFS querying is inherently
  # relational (joins across trips/stop_times/calendar), which a
  # key-value store isn't suited for.
  sqflite: ^2.3.3+1
  # archive: unzips the GTFS feed (a .zip of .txt files) before parsing.
  archive: ^4.0.9
  # csv: proper quoted-field CSV parsing for GTFS's .txt files — GTFS
  # is CSV despite the .txt extension, and some fields (e.g. stop
  # names, route long names) can contain commas within quotes that a
  # naive String.split(',') would mis-parse.
  csv: ^6.0.0
  # path: builds the on-device SQLite database file path.
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4

  # path_provider_platform_interface: used directly in
  # test/unit/voice_event_export_test.dart to fake the platform-
  # channel-backed getApplicationDocumentsPath() call, which has no
  # real platform implementation in a plain `flutter test` process.
  path_provider_platform_interface: ^2.1.2

  # sqflite_common_ffi: the standard way to unit-test sqflite-backed
  # code (GtfsDatabase/GtfsRepository) without a real device/emulator —
  # overrides sqflite's global `databaseFactory` with a pure-Dart FFI
  # SQLite implementation usable inside a plain `flutter test` process.
  # Used in test/unit/gtfs_repository_test.dart. Test-only; production
  # code is unchanged and still uses the real platform-channel sqflite.
  sqflite_common_ffi: ^2.3.3

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # Added for Milestone 1 (Improved Object Detection): bundles the COCO
  # model + labels once you've added them per assets/ml_models/README.md.
  # The folder currently only contains that README, so this declaration
  # is safe even before the model files are added.
  assets:
    - assets/ml_models/
    # Non-recursive: Flutter's directory asset declarations only pick
    # up files directly inside the listed folder, so the benchmark
    # candidates' subfolder needs its own entry (see
    # assets/ml_models/README.md for what goes here).
    - assets/ml_models/benchmark_candidates/
    # Stage 2: bundled GTFS feed for import + the validation report
    # screen — see lib/services/gtfs/gtfs_import_service.dart.
    - assets/gtfs/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/insight_logo.png"
